[project]
name = "sunjudge-backend"
version = "0.1.0"
description = "Flask backend for SunJudge"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "flask-login>=0.6.3",
    "flask-migrate>=4.0.5",
    "flask-sqlalchemy>=3.1.1",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.0.0",
    "pymysql[rsa]>=1.1.1",
    "cryptography>=44.0.0",
    "gunicorn>=23.0.0; sys_platform != 'win32'",
    "pillow>=12.3.0",
    "markdown-it-py>=4.2.0",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
