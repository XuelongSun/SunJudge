# First-time HTTPS bootstrap only. Replace judge.example.cn before enabling.
# No application API is served over plain HTTP.
server {
    listen 80;
    server_name judge.example.cn;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        default_type text/plain;
        return 503 "SunJudge HTTPS setup pending.\n";
    }
}
