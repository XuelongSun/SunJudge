[program:sunjudge]
directory=/srv/sunjudge/backend
command=/srv/sunjudge/backend/.venv/bin/gunicorn --config /srv/sunjudge/deploy/gunicorn.conf.py app:create_app()
user=sunjudge
environment=PATH="/srv/sunjudge/backend/.venv/bin:/usr/local/bin:/usr/bin:/bin",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=150
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/sunjudge/app.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
