# Replace judge.example.cn and provision its certificate before enabling this file.
limit_req_zone $binary_remote_addr zone=sunjudge_login:10m rate=5r/m;

server {
    listen 80;
    server_name judge.example.cn;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name judge.example.cn;
    ssl_certificate /etc/letsencrypt/live/judge.example.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/judge.example.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/sunjudge/frontend/dist;
    index index.html;
    # Includes multipart overhead for a maximum 64 MiB file.
    client_max_body_size 66m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location = /api/auth/login {
        limit_req zone=sunjudge_login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/sunjudge-proxy.conf;
    }
    # Includes /api/assets/...: images must retain session-based authorization.
    location /api/ { include /etc/nginx/snippets/sunjudge-proxy.conf; }
    location / { try_files $uri $uri/ /index.html; }
    # Uploads are never exposed as static resources.
    location /uploads/ { return 404; }
}
